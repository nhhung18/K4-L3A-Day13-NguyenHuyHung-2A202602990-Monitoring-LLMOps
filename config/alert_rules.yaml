alerts:
  - name: high_latency_p95
    severity: critical
    condition: p95_latency_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: on-call-sre
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 3m
    type: symptom-based
    channel: slack
    owner: on-call-sre
    runbook: docs/alerts.md#alert-2
  - name: quality_degradation
    severity: warning
    condition: quality_score_avg < 0.75
    duration: 10m
    type: symptom-based
    channel: slack
    owner: ml-team
    runbook: docs/alerts.md#alert-3
